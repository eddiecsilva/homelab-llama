name: validate

# Checks do proprio repositorio: o compose tem que ser valido, o .env.example
# tem que cobrir todas as variaveis e nenhum segredo pode estar preenchido.
# O smoke test funcional do WhisperX fica fora do CI de proposito: ele precisa
# de GPU, baixa o modelo e sobe o container. Ele roda na maquina do homelab,
# contra o stack real.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: compose e .env.example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar o .env.example para .env
        run: cp .env.example .env

      - name: Validar o compose
        run: docker compose config --quiet

      - name: Conferir o contrato compose x os dois templates
        run: |
          python3 scripts/check-env-contract.py .env.example
          python3 scripts/check-env-contract.py .env.example.small

      - name: Compilar os scripts
        run: python3 -m py_compile scripts/check-env-contract.py scripts/check-hardware.py

      - name: Conferir que o compose nao usa variavel com prefixo invalido
        run: |
          # A imagem do WhisperX le DEVICE/COMPUTE_TYPE/BATCH_SIZE/... e ignora
          # WHISPERX_*. O AnythingLLM le GENERIC_OPEN_AI_*, nao GENERIC_OPENAI_*.
          if grep -nE '\$\{(WHISPERX_(WORKERS|AUDIO_DEVICE|LANGUAGES|LANGUAGE|PROMPT|MAX_LINES|TTS_|ENABLE_GPU|NUM_PROCESSORS|RUN_ON_GPU|THREADS|SEED|USE_WK|WK_)|GENERIC_OPENAI_|SEARXNG_LANGUAGE)' compose.yaml; then
            echo "::error::compose.yaml referencia variavel que a imagem ignora"
            exit 1
          fi
          echo "ok: nenhuma variavel invalida"
