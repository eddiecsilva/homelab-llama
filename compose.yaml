name: "${COMPOSE_PROJECT_NAME}"

x-service-defaults: &service-defaults
  init: true
  restart: unless-stopped
  networks:
    - ai-stack
  # Rotacao de log: tracebacks de VRAM e do llama.cpp crescem sem limite
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  llama-gpu:
    <<: *service-defaults
    image: "${LLAMA_GPU_IMAGE}"
    entrypoint:
      - /app/llama-server
    # --sleep-idle-seconds nao tem variavel de ambiente no llama.cpp:
    # o servidor libera a VRAM depois de X segundos sem requisicoes.
    command:
      - "--image-min-tokens"
      - "${LLAMA_IMAGE_MAX_TOKENS}"
      - "--sleep-idle-seconds"
      - "${LLAMA_SLEEP_IDLE_SECONDS}"
    ports:
      - "${BIND_ADDRESS}:${LLAMA_GPU_PORT}:8080"
    environment:
      TZ: "${TZ}"
      HF_TOKEN: "${HF_TOKEN}"
      LLAMA_ARG_CONTEXT_SHIFT: "${LLAMA_CONTEXT_SHIFT}"
      LLAMA_CACHE: /cache
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_MODELS_DIR: /models/chat
      LLAMA_ARG_MODELS_MAX: "${LLAMA_MODELS_MAX}"
      LLAMA_ARG_MODELS_AUTOLOAD: "${LLAMA_MODELS_AUTOLOAD}"
      LLAMA_ARG_CTX_SIZE: "${LLAMA_CTX_SIZE}"
      LLAMA_ARG_N_PARALLEL: "${LLAMA_PARALLEL}"
      LLAMA_ARG_N_GPU_LAYERS: "${LLAMA_GPU_LAYERS}"
      LLAMA_ARG_FIT: "${LLAMA_FIT}"
      LLAMA_ARG_FIT_TARGET: "${LLAMA_FIT_TARGET}"
      LLAMA_ARG_FLASH_ATTN: "${LLAMA_FLASH_ATTN}"
      LLAMA_ARG_BATCH: "${LLAMA_BATCH_SIZE}"
      LLAMA_ARG_UBATCH: "${LLAMA_UBATCH_SIZE}"
      LLAMA_ARG_THREADS_HTTP: "${LLAMA_HTTP_THREADS}"
      LLAMA_ARG_CACHE_PROMPT: "${LLAMA_CACHE_PROMPT}"
      LLAMA_ARG_JINJA: "${LLAMA_JINJA}"
      LLAMA_ARG_UI: "${LLAMA_WEBUI}"
      LLAMA_ARG_ENDPOINT_METRICS: "${LLAMA_METRICS}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES}"
      #LLAMA_ARG_ALIAS: "${CHAT_MODEL}"
      LLAMA_ARG_THREADS: "${LLAMA_THREADS}"
      LLAMA_ARG_N_CPU_MOE: "${LLAMA_CPU_MOE_LAYERS}"
      LLAMA_ARG_CACHE_TYPE_K: "${LLAMA_CACHE_TYPE_K}"
      LLAMA_ARG_CACHE_TYPE_V: "${LLAMA_CACHE_TYPE_V}"
      LLAMA_ARG_MMPROJ_OFFLOAD: "${LLAMA_MMPROJ_OFFLOAD}"
      LLAMA_ARG_IMAGE_MAX_TOKENS: "${LLAMA_IMAGE_MAX_TOKENS}"
      LLAMA_ARG_CONT_BATCHING: "${LLAMA_CONT_BATCHING}"
      LLAMA_ARG_CACHE_RAM: "${LLAMA_CACHE_RAM}"
    volumes:
      - "${MODELS_DIR}/chat:/models/chat"
      - ./data/llama-gpu/cache:/cache
    mem_limit: "${LLAMA_GPU_MEM_LIMIT}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${NVIDIA_GPU_DEVICE_ID}"
              capabilities:
                - gpu, compute, utility

  llama-embed:
    <<: *service-defaults
    image: "${LLAMA_CPU_IMAGE}"
    entrypoint:
      - /app/llama-server
    command: []
    ports:
      - "${BIND_ADDRESS}:${LLAMA_EMBED_PORT}:8080"
    environment:
      TZ: "${TZ}"
      HF_TOKEN: "${HF_TOKEN}"
      LLAMA_CACHE: /cache
      LLAMA_ARG_HOST: 0.0.0.0
      LLAMA_ARG_PORT: "8080"
      LLAMA_ARG_HF_REPO: "${EMBEDDING_HF_REPO}"
      LLAMA_ARG_ALIAS: "${EMBEDDING_MODEL}"
      LLAMA_ARG_EMBEDDINGS: "true"
      LLAMA_ARG_POOLING: "${EMBEDDING_POOLING}"
      LLAMA_ARG_N_GPU_LAYERS: "0"
      LLAMA_ARG_CTX_SIZE: "${EMBEDDING_CTX_SIZE}"
      LLAMA_ARG_N_PARALLEL: "${EMBEDDING_PARALLEL}"
      LLAMA_ARG_THREADS: "${EMBEDDING_THREADS}"
      LLAMA_ARG_BATCH: "${EMBEDDING_BATCH_SIZE}"
      LLAMA_ARG_UBATCH: "${EMBEDDING_UBATCH_SIZE}"
      LLAMA_ARG_UI: "false"
      LLAMA_ARG_ENDPOINT_METRICS: "${EMBEDDING_METRICS}"
    volumes:
      - ./data/llama-embed/cache:/cache
    mem_limit: "${LLAMA_EMBED_MEM_LIMIT}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  searxng:
    <<: *service-defaults
    image: "${SEARXNG_IMAGE}"
    ports:
      - "${BIND_ADDRESS}:${SEARXNG_PORT}:8080"
    environment:
      TZ: "${TZ}"
      SEARXNG_BASE_URL: "http://${PUBLIC_HOST}:${SEARXNG_PORT}/"
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: "${SEARXNG_SECRET}"
      SEARXNG_LIMITER: "${SEARXNG_LIMITER}"
      SEARXNG_IMAGE_PROXY: "${SEARXNG_IMAGE_PROXY}"
    volumes:
      - ./config/searxng:/etc/searxng
      - ./data/searxng/cache:/var/cache/searxng
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  open-webui:
    <<: *service-defaults
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: "${OPENWEBUI_IMAGE}"
    ports:
      - "${BIND_ADDRESS}:${OPENWEBUI_PORT}:8080"
    depends_on:
      llama-gpu:
        condition: service_healthy
      llama-embed:
        condition: service_healthy
      searxng:
        condition: service_healthy
    environment:
      TZ: "${TZ}"
      WEBUI_URL: "http://${PUBLIC_HOST}:${OPENWEBUI_PORT}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY}"
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS}"
      DEFAULT_LOCALE: "${OPENWEBUI_DEFAULT_LOCALE}"
      DEFAULT_MODELS: "${CHAT_MODEL}"
      DEFAULT_PINNED_MODELS: "${CHAT_MODEL}"
      ENABLE_SIGNUP: "${OPENWEBUI_ENABLE_SIGNUP}"
      ENABLE_PERSISTENT_CONFIG: "${OPENWEBUI_PERSISTENT_CONFIG}"
      UVICORN_WORKERS: "${OPENWEBUI_WORKERS}"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: "${LLAMA_GPU_API_URL}"
      OPENAI_API_KEY: "${OPENAI_COMPAT_API_KEY}"
      VECTOR_DB: "${OPENWEBUI_VECTOR_DB}"
      RAG_EMBEDDING_ENGINE: "${OPENWEBUI_RAG_ENGINE}"
      RAG_EMBEDDING_MODEL: "${EMBEDDING_MODEL}"
      RAG_OPENAI_API_BASE_URL: "${LLAMA_EMBED_API_URL}"
      RAG_OPENAI_API_KEY: "${OPENAI_COMPAT_API_KEY}"
      RAG_EMBEDDING_OPENAI_BATCH_SIZE: "${OPENWEBUI_RAG_BATCH_SIZE}"
      RAG_TOP_K: "${OPENWEBUI_RAG_TOP_K}"
      ENABLE_RAG_HYBRID_SEARCH: "${OPENWEBUI_ENABLE_HYBRID_SEARCH}"
      ENABLE_WEB_SEARCH: "${OPENWEBUI_ENABLE_WEB_SEARCH}"
      WEB_SEARCH_ENGINE: "${OPENWEBUI_WEB_SEARCH_ENGINE}"
      WEB_SEARCH_RESULT_COUNT: "${OPENWEBUI_WEB_SEARCH_RESULTS}"
      WEB_SEARCH_CONCURRENT_REQUESTS: "${OPENWEBUI_WEB_SEARCH_CONCURRENCY}"
      WEB_LOADER_CONCURRENT_REQUESTS: "${OPENWEBUI_WEB_LOADER_CONCURRENCY}"
      SEARXNG_QUERY_URL: "${SEARXNG_QUERY_URL}"
      USER_AGENT: "${OPENWEBUI_USER_AGENT}"
      ENABLE_MEMORY_SYSTEM_CONTEXT: "True"
      ENABLE_MEMORIES: "True"
      ENABLE_MEMORY_BACKGROUND_REVIEW: "True"
      DEFAULT_MODEL_PARAMS: '{"function_calling": "legacy"}'
      ENABLE_CONTEXT_COMPACTION: "${ENABLE_CONTEXT_COMPACTION}"
      CONTEXT_COMPACTION_TOKEN_THRESHOLD: "${CONTEXT_COMPACTION_TOKEN_THRESHOLD}"
      CONTEXT_COMPACTION_TOKEN_CAP: "${CONTEXT_COMPACTION_TOKEN_CAP}"
      CONTEXT_COMPACTION_RETENTION_PERCENTAGE: "${CONTEXT_COMPACTION_RETENTION_PERCENTAGE}"
      WHISPER_MODEL: "${OPENWEBUI_WHISPER_MODEL}"
      WHISPER_LANGUAGE: "${OPENWEBUI_WHISPER_LANGUAGE}"
      WHISPER_MULTILINGUAL: "${OPENWEBUI_WHISPER_MULTILINGUAL}"
      # O container do Open WebUI nao tem GPU: o motor local de STT precisa de int8
      WHISPER_COMPUTE_TYPE: "${OPENWEBUI_WHISPER_COMPUTE_TYPE}"
      # STT via API compativel com OpenAI apontando para o servico WhisperX
      AUDIO_STT_ENGINE: "${OPENWEBUI_AUDIO_STT_ENGINE}"
      AUDIO_STT_OPENAI_API_BASE_URL: "${OPENWEBUI_AUDIO_STT_OPENAI_API_BASE_URL}"
      AUDIO_STT_OPENAI_API_KEY: "${OPENWEBUI_AUDIO_STT_OPENAI_API_KEY}"
    volumes:
      - ./data/open-webui:/app/backend/data
    mem_limit: "${OPENWEBUI_MEM_LIMIT}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  anythingllm:
    <<: *service-defaults
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: "${ANYTHINGLLM_IMAGE}"
    ports:
      - "${BIND_ADDRESS}:${ANYTHINGLLM_PORT}:3001"
    depends_on:
      llama-gpu:
        condition: service_healthy
      llama-embed:
        condition: service_healthy
      searxng:
        condition: service_healthy
    cap_add:
      - SYS_ADMIN
    environment:
      TZ: "${TZ}"
      SERVER_PORT: "3001"
      STORAGE_DIR: /app/server/storage
      SIG_KEY: "${ANYTHINGLLM_SIG_KEY}"
      SIG_SALT: "${ANYTHINGLLM_SIG_SALT}"
      LLM_PROVIDER: "${ANYTHINGLLM_LLM_PROVIDER}"
      # A imagem le GENERIC_OPEN_AI_* (com OPEN_AI separado).
      GENERIC_OPEN_AI_BASE_PATH: "${LLAMA_GPU_API_URL}"
      GENERIC_OPEN_AI_MODEL_PREF: "${CHAT_MODEL}"
      GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT: "${LLAMA_CTX_SIZE}"
      GENERIC_OPEN_AI_API_KEY: "${OPENAI_COMPAT_API_KEY}"
      GENERIC_OPEN_AI_MAX_TOKENS: "${ANYTHINGLLM_GENERIC_MAX_TOKENS}"
      EMBEDDING_ENGINE: "${ANYTHINGLLM_EMBEDDING_ENGINE}"
      EMBEDDING_BASE_PATH: "${LLAMA_EMBED_API_URL}"
      EMBEDDING_MODEL_PREF: "${EMBEDDING_MODEL}"
      EMBEDDING_MODEL_MAX_CHUNK_LENGTH: "${ANYTHINGLLM_EMBEDDING_CHUNK_LENGTH}"
      GENERIC_OPEN_AI_EMBEDDING_API_KEY: "${OPENAI_COMPAT_API_KEY}"
      GENERIC_OPEN_AI_EMBEDDING_MAX_CONCURRENT_CHUNKS: "${ANYTHINGLLM_EMBEDDING_CONCURRENCY}"
      GENERIC_OPEN_AI_EMBEDDING_API_DELAY_MS: "${ANYTHINGLLM_EMBEDDING_DELAY_MS}"
      VECTOR_DB: "${ANYTHINGLLM_VECTOR_DB}"
      AGENT_SEARXNG_API_URL: "${SEARXNG_INTERNAL_URL}"
      TARGET_OCR_LANG: "${ANYTHINGLLM_OCR_LANGUAGES}"
      DISABLE_TELEMETRY: "${ANYTHINGLLM_DISABLE_TELEMETRY}"
      ANYTHINGLLM_CHROMIUM_ARGS: "${ANYTHINGLLM_CHROMIUM_ARGS}"
    volumes:
     - ./data/anythingllm:/app/server/storage
    mem_limit: "${ANYTHINGLLM_MEM_LIMIT}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

  whisperx:
    <<: *service-defaults
    extra_hosts:
      - "host.docker.internal:host-gateway"
    runtime: nvidia
    image: "${WHISPERX_IMAGE}"
    ports:
      - "${BIND_ADDRESS}:${WHISPERX_PORT}:9000"
    environment:
      TZ: "${TZ}"
      # A imagem (app/pipeline.py) le estas variaveis SEM o prefixo WHISPERX_.
      # Qualquer coisa com prefixo WHISPERX_ e ignorado silenciosamente.
      DEVICE: "${WHISPERX_DEVICE}"
      COMPUTE_TYPE: "${WHISPERX_COMPUTE_TYPE}"
      # Janelas de 30 s em paralelo na GPU: acima de 4 o large-v3 estoura a VRAM
      BATCH_SIZE: "${WHISPERX_BATCH_SIZE}"
      # Alinhamento de timestamps na CPU poupa ~1,9 GB de VRAM
      ALIGN_DEVICE: "${WHISPERX_ALIGN_DEVICE}"
      # Cache do Hugging Face no volume persistente (evita rebaixar ~3 GB)
      CACHE_DIR: "${WHISPERX_CACHE_DIR}"
      DEFAULT_MODEL: "${WHISPERX_MODEL}"
      MAX_LOADED_MODELS: "${WHISPERX_MAX_LOADED_MODELS}"
      MAX_FILE_SIZE_MB: "${WHISPERX_MAX_FILE_SIZE_MB}"
      MODEL_KEEP_ALIVE_SECONDS: "${WHISPERX_MODEL_KEEP_ALIVE_SECONDS}"
      MODEL_EVICTION_INTERVAL_SECONDS: "${WHISPERX_MODEL_EVICTION_INTERVAL_SECONDS}"
      # Necessario para a diarizacao (pyannote speaker-diarization-community-1)
      HF_TOKEN: "${HF_TOKEN}"
      NVIDIA_DRIVER_CAPABILITIES: "${NVIDIA_DRIVER_CAPABILITIES}"
      LOG_LEVEL: "${WHISPERX_LOGLEVEL}"
    volumes:
      - "${MODELS_DIR}/whisperx:/app/models"
      - ./data/whisperx:/app/data
    mem_limit: "${WHISPERX_MEM_LIMIT}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${NVIDIA_GPU_DEVICE_ID}"
              capabilities:
                - gpu, compute, utility


  vane:
    <<: *service-defaults
    image: "${VANE_IMAGE}"
    ports:
      - "${BIND_ADDRESS}:${VANE_PORT}:3000"
    depends_on:
      llama-gpu:
        condition: service_healthy
      llama-embed:
        condition: service_healthy
      searxng:
        condition: service_healthy
    environment:
      TZ: "${TZ}"
      DATA_DIR: /home/vane
      SEARXNG_API_URL: "${SEARXNG_INTERNAL_URL}"
      OPENAI_API_KEY: "${OPENAI_COMPAT_API_KEY}"
      OPENAI_BASE_URL: "${LLAMA_GPU_API_URL}"
      LM_STUDIO_BASE_URL: "http://llama-gpu:8080"
      NEXT_TELEMETRY_DISABLED: "${VANE_DISABLE_TELEMETRY}"
    volumes:
       - ./data/vane:/home/vane/data
    healthcheck:
      # O Vane faz bind no IP do container (HOSTNAME), nao em 127.0.0.1
      test: ["CMD", "node", "-e", "const h=require('os').hostname();fetch('http://'+h+':3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  freshrss:
    <<: *service-defaults
    image: "${FRESHRSS_IMAGE}"
    ports:
      - "${BIND_ADDRESS}:${FRESHRSS_PORT}:80"
    environment:
      TZ: "${TZ}"
      CRON_MIN: "${FRESHRSS_CRON_MIN}"
      FRESHRSS_INSTALL: |-
        --api-enabled
        --base-url ${FRESHRSS_BASE_URL}
        --default-user ${FRESHRSS_USERNAME}
        --language pt_BR
      FRESHRSS_USER: |-
        --user ${FRESHRSS_USERNAME}
        --password ${FRESHRSS_PASSWORD}
        --api-password ${FRESHRSS_API_PASSWORD}
    volumes:
      - ./data/freshrss/data:/var/www/FreshRSS/data
      - ./data/freshrss/extensions:/var/www/FreshRSS/extensions
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/') ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  ai-stack:
    driver: bridge
